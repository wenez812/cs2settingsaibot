<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CS2 Pro Settings</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2715%27 fill=%27%239b7bff%27/%3E%3Cellipse cx=%2732%27 cy=%2732%27 rx=%2728%27 ry=%279%27 fill=%27none%27 stroke=%27%235ee7ff%27 stroke-width=%273%27 transform=%27rotate(-22 32 32)%27/%3E%3C/svg%3E">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #04050c;
    --bg2: #0a0c1e;
    --surface: rgba(16, 20, 46, .66);
    --surface-hi: rgba(26, 32, 72, .78);
    --line: rgba(140, 160, 255, .15);
    --line-hi: rgba(120, 220, 255, .45);
    --text: #e9ecff;
    --muted: #8d95c7;
    --cyan: #5ee7ff;
    --violet: #9b7bff;
    --pink: #ff6bd6;
    --amber: #ffcf6b;
    --green: #6bffb0;
    --radius: 18px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }
  body {
    background:
      radial-gradient(900px 600px at 85% -10%, rgba(155, 123, 255, .22), transparent 60%),
      radial-gradient(800px 600px at -10% 20%, rgba(94, 231, 255, .13), transparent 60%),
      radial-gradient(700px 500px at 60% 110%, rgba(255, 107, 214, .12), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .app { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; padding: 14px 16px calc(28px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  /* ---------- шапка ---------- */
  .top { display: flex; align-items: center; gap: 12px; padding: 6px 2px 14px; }
  .logo { width: 44px; height: 44px; flex: none; filter: drop-shadow(0 0 14px rgba(155, 123, 255, .55)); }
  .top h1 { margin: 0; font-size: 20px; letter-spacing: .02em; font-weight: 700; }
  .top h1 span { background: linear-gradient(90deg, var(--cyan), var(--violet) 60%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .top p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }

  /* ---------- поиск ---------- */
  .search { position: sticky; top: 0; z-index: 5; padding: 6px 0 10px; margin: 0 -2px;
    background: linear-gradient(180deg, rgba(4, 5, 12, .6) 50%, rgba(4, 5, 12, 0)); }
  .field { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 48px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: border-color .2s, box-shadow .2s; }
  .field:focus-within { border-color: var(--line-hi); box-shadow: 0 0 0 4px rgba(94, 231, 255, .08), 0 0 24px rgba(94, 231, 255, .12); }
  .field svg { width: 20px; height: 20px; flex: none; stroke: var(--muted); }
  .field input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; color: var(--text); font-size: 16px; font-family: inherit; }
  .field input::placeholder { color: #6f77a8; }
  .field .clear { display: none; width: 26px; height: 26px; border-radius: 50%; background: rgba(255, 255, 255, .08); color: var(--muted); line-height: 26px; font-size: 16px; }
  .field.has .clear { display: block; }

  .chips { display: flex; gap: 8px; margin: 12px 0 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 8px 14px; border-radius: 999px; font-size: 13.5px; color: var(--muted); background: var(--surface);
    border: 1px solid var(--line); transition: all .2s; white-space: nowrap; }
  .chip.on { color: #06101c; font-weight: 700; background: linear-gradient(90deg, var(--cyan), var(--violet)); border-color: transparent; box-shadow: 0 0 22px rgba(94, 231, 255, .3); }
  .meta { display: flex; justify-content: space-between; align-items: center; margin: 10px 2px 8px; font-size: 12.5px; color: var(--muted); }
  .meta select { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font: inherit; font-size: 12.5px; }

  /* ---------- список ---------- */
  .list { display: grid; gap: 9px; }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 13px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: transform .15s, border-color .2s, background .2s, box-shadow .2s; animation: rise .35s both; }
  .row:hover, .row:active { border-color: var(--line-hi); background: var(--surface-hi); box-shadow: 0 0 26px rgba(94, 231, 255, .1); transform: translateY(-1px); }
  .rank { width: 26px; text-align: center; font-family: var(--mono); font-weight: 700; color: var(--amber); font-size: 15px; flex: none; }
  .av { position: relative; width: 48px; height: 48px; flex: none; border-radius: 50%; padding: 2px;
    background: conic-gradient(from 200deg, var(--cyan), var(--violet), var(--pink), var(--cyan)); }
  .av > div, .av > img { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; object-fit: cover; background: #0b0e24; font-weight: 700; font-size: 18px; color: var(--cyan); }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who small { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { flex: none; padding: 5px 10px; border-radius: 999px; font-family: var(--mono); font-size: 12px; color: var(--cyan);
    background: rgba(94, 231, 255, .08); border: 1px solid rgba(94, 231, 255, .22); }
  .fav { color: var(--amber); margin-left: -2px; }
  .empty, .error { text-align: center; padding: 46px 20px; color: var(--muted); }
  .empty .big { font-size: 42px; margin-bottom: 8px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 14px; font-weight: 700;
    color: #06101c; background: linear-gradient(90deg, var(--cyan), var(--violet)); box-shadow: 0 6px 24px rgba(155, 123, 255, .35); }
  .btn.ghost { color: var(--text); background: var(--surface); border: 1px solid var(--line); box-shadow: none; font-weight: 600; }
  .sk { height: 72px; border-radius: var(--radius); border: 1px solid var(--line);
    background: linear-gradient(100deg, rgba(255,255,255,.03) 30%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.03) 70%) var(--surface); background-size: 200% 100%; animation: sh 1.4s infinite linear; }
  @keyframes sh { to { background-position: -200% 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  #more { height: 1px; }

  /* ---------- карточка игрока ---------- */
  .sheet { position: fixed; inset: 0; z-index: 20; overflow: hidden;
    background:
      radial-gradient(800px 560px at 90% -8%, rgba(155, 123, 255, .26), transparent 60%),
      radial-gradient(700px 520px at -10% 30%, rgba(94, 231, 255, .14), transparent 60%),
      radial-gradient(640px 480px at 70% 108%, rgba(255, 107, 214, .14), transparent 60%),
      linear-gradient(180deg, #04050c, #080a1c);
    transform: translateY(100%); opacity: 0; visibility: hidden; transition: transform .32s cubic-bezier(.2,.8,.2,1), opacity .25s, visibility 0s .32s; }
  .sheet::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .75; animation: tw 5s ease-in-out infinite alternate;
    background-image:
      radial-gradient(1px 1px at 20px 30px, #fff, transparent), radial-gradient(1.3px 1.3px at 96px 124px, #bfe9ff, transparent),
      radial-gradient(1px 1px at 158px 58px, #fff, transparent), radial-gradient(1.5px 1.5px at 62px 176px, #ffd6f5, transparent),
      radial-gradient(1px 1px at 128px 14px, #cfe4ff, transparent);
    background-size: 210px 210px; }
  .sheet .scroll { position: absolute; inset: 0; z-index: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  @keyframes tw { from { opacity: .35; } to { opacity: .9; } }
  .sheet.open { transform: none; opacity: 1; visibility: visible; transition-delay: 0s; }
  .sheet .in { max-width: 600px; margin: 0 auto; padding: 14px 16px calc(40px + env(safe-area-inset-bottom)); }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .round { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: var(--surface); border: 1px solid var(--line); }
  .round.on { color: var(--amber); border-color: rgba(255, 207, 107, .5); box-shadow: 0 0 18px rgba(255, 207, 107, .25); }
  .hero { text-align: center; padding: 6px 0 16px; }
  .hero .av { width: 92px; height: 92px; margin: 0 auto 12px; padding: 3px; box-shadow: 0 0 40px rgba(155, 123, 255, .45); }
  .hero .av > div { font-size: 36px; }
  .hero h2 { margin: 0; font-size: 26px; letter-spacing: .01em; }
  .hero p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .tile { padding: 12px 8px; text-align: center; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
  .tile b { display: block; font-family: var(--mono); font-size: 17px; color: var(--cyan); }
  .tile span { display: block; margin-top: 3px; font-size: 11.5px; color: var(--muted); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 4px -16px 14px; padding: 4px 16px; position: sticky; top: 0; z-index: 3;
    background: linear-gradient(180deg, rgba(5,6,16,.96) 65%, rgba(5,6,16,0)); }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; padding: 9px 14px; border-radius: 12px; font-size: 14px; color: var(--muted); border: 1px solid transparent; transition: all .2s; }
  .tab.on { color: var(--text); background: var(--surface-hi); border-color: var(--line-hi); box-shadow: 0 0 18px rgba(94, 231, 255, .14); }
  .panel { display: none; animation: rise .3s both; }
  .panel.on { display: block; }
  .card { padding: 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); margin-bottom: 12px; }
  .card h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--violet); font-weight: 700; }
  .kv { display: grid; }
  .kv div { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1px solid rgba(140,160,255,.09); font-size: 14.5px; }
  .kv div:last-child { border: 0; }
  .kv span { color: var(--muted); }
  .kv b { text-align: right; font-weight: 600; }
  .code { position: relative; margin: 0 0 10px; padding: 12px 12px 12px 14px; padding-right: 76px; border-radius: 14px; font-family: var(--mono); font-size: 12.5px; line-height: 1.5;
    color: #c9f6ff; background: rgba(2, 4, 14, .75); border: 1px solid rgba(94, 231, 255, .18); word-break: break-word; }
  .copy { position: absolute; top: 8px; right: 8px; padding: 7px 11px; border-radius: 10px; font-size: 12.5px; font-weight: 700; color: #06101c; background: linear-gradient(90deg, var(--cyan), var(--violet)); }
  .copy.done { background: var(--green); }
  .hint { font-size: 12.5px; line-height: 1.5; color: var(--muted); margin: 8px 2px 0; }
  .hint code { font-family: var(--mono); color: var(--cyan); font-size: 12px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .acts .btn { flex: 1 1 140px; }
  .warn { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .warn li { font-size: 12.5px; color: #e8d3a0; padding: 8px 10px; border-radius: 10px; background: rgba(255, 207, 107, .07); border: 1px solid rgba(255, 207, 107, .2); }
  .stage { position: relative; display: grid; place-items: center; height: 200px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 10px; }
  .stage canvas { image-rendering: pixelated; }
  .stage .lab { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: rgba(255,255,255,.55); font-family: var(--mono); text-shadow: 0 1px 4px #000; }
  .bgs { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
  .bgs button { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); }
  .bgs button.on { border-color: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  .toast { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translate(-50%, 30px); opacity: 0; z-index: 50; pointer-events: none;
    padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; width: max-content; max-width: calc(100vw - 32px); text-align: center; color: #06101c; background: var(--green); box-shadow: 0 8px 30px rgba(0,0,0,.5); transition: all .25s; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .foot { margin: 22px 4px 0; font-size: 12px; line-height: 1.6; color: #646c9c; text-align: center; }
  .foot a { color: var(--cyan); text-decoration: none; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<main class="app">
  <header class="top">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ee7ff"/><stop offset=".55" stop-color="#9b7bff"/><stop offset="1" stop-color="#ff6bd6"/></linearGradient>
        <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#5ee7ff"/><stop offset="1" stop-color="#ff6bd6"/></linearGradient>
      </defs>
      <circle cx="32" cy="32" r="15" fill="url(#g1)"/>
      <ellipse cx="32" cy="32" rx="28" ry="9" fill="none" stroke="url(#g2)" stroke-width="2.6" transform="rotate(-22 32 32)" opacity=".95"/>
      <circle cx="32" cy="32" r="3" fill="#04050c"/><path d="M32 26v12M26 32h12" stroke="#04050c" stroke-width="1.4"/>
    </svg>
    <div>
      <h1>CS2 <span>Pro Settings</span></h1>
      <p id="sub">Загружаем звёздную карту…</p>
    </div>
  </header>

  <div class="search">
    <label class="field" id="field">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Найти игрока: ник или имя" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button class="clear" id="clr" type="button" aria-label="Очистить">×</button>
    </label>
  </div>

  <div class="chips" id="chips" role="tablist">
    <button class="chip on" data-m="all" type="button">🪐 Все</button>
    <button class="chip" data-m="top" type="button">🏆 Топ-10 HLTV</button>
    <button class="chip" data-m="fav" type="button">★ Избранное</button>
  </div>

  <div class="meta">
    <span id="count"></span>
    <select id="sort" aria-label="Сортировка">
      <option value="az">А–Я по нику</option>
      <option value="lo">eDPI: по возрастанию</option>
      <option value="hi">eDPI: по убыванию</option>
    </select>
  </div>

  <section class="list" id="list"></section>
  <div id="more"></div>

  <p class="foot">
    Данные: <a href="https://github.com/AntonyPerez0/cs2-pro-configs" target="_blank" rel="noopener">cs2-pro-configs</a> (MIT) · settings.gg.<br>
    Прицелы пересчитаны сообществом в новую систему CS2 и могут отличаться от оригинала.
  </p>
</main>

<div class="sheet" id="sheet" aria-hidden="true"><div class="scroll" id="scroll"><div class="in" id="sheetIn"></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';

  // ================= Telegram =================
  var tg = window.Telegram && window.Telegram.WebApp;
  try {
    if (tg) {
      tg.ready(); tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#04050c');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#04050c');
      if (tg.setBottomBarColor) tg.setBottomBarColor('#04050c');
    }
  } catch (e) {}
  function haptic(kind) { try { tg.HapticFeedback.impactOccurred(kind || 'light'); } catch (e) {} }
  function notify(kind) { try { tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} }

  // ================= Источники данных =================
  var params = new URLSearchParams(location.search);
  var SOURCES = params.get('src') ? [params.get('src')] : [
    'https://raw.githubusercontent.com/AntonyPerez0/cs2-pro-configs/main/',
    'https://copyprosta.com/'
  ];
  SOURCES = SOURCES.map(function (s) { return s.endsWith('/') ? s : s + '/'; });
  var TTL = 6 * 3600 * 1000;

  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  function fetchText(rel) {
    var i = 0;
    function next(err) {
      if (i >= SOURCES.length) return Promise.reject(err || new Error('нет источников'));
      var url = SOURCES[i++] + rel;
      return fetch(url, { cache: 'no-cache' }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      }).then(function (t) { return { text: t, base: url.slice(0, url.length - rel.length) }; }).catch(next);
    }
    return next();
  }
  // Кэш в localStorage: быстрый повторный запуск + запасной вариант без сети
  function cached(rel, key, big) {
    var c = lsGet(key);
    if (c && Date.now() - c.t < TTL) return Promise.resolve(c.d);
    return fetchText(rel).then(function (res) {
      var d = JSON.parse(res.text);
      lsSet(key, { t: Date.now(), d: big ? d : d });
      return d;
    }).catch(function (e) { if (c) return c.d; throw e; });
  }

  // ================= Состояние =================
  var S = { players: [], by: {}, xh: {}, top: null, generated: '', mode: 'all', sort: 'az', q: '', favs: lsGet('favs') || [], shown: 0, view: [], base: SOURCES[0] };
  var $ = function (id) { return document.getElementById(id); };
  var PAGE = 30;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return String(s || '').toLowerCase().replace(/[^0-9a-zа-яё]+/g, ''); }

  // ================= Звёздное небо =================
  (function sky() {
    var c = $('sky'), x = c.getContext('2d');
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var stars = [], W = 0, H = 0, dpr = 1, shoot = null, last = 0, running = true;
    function size() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.round(Math.min(150, W * H / 7000));
      stars = [];
      for (var i = 0; i < n; i++) {
        var z = Math.random();
        stars.push({ x: Math.random() * W, y: Math.random() * H, r: .3 + z * 1.2, v: 2 + z * 9, ph: Math.random() * 6.28, sp: .6 + Math.random() * 1.8,
          hue: Math.random() < .2 ? '170,210,255' : (Math.random() < .15 ? '255,200,240' : '255,255,255') });
      }
    }
    function frame(t) {
      if (!running) return;
      var dt = Math.min((t - last) / 1000, .05); last = t;
      x.clearRect(0, 0, W, H);
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        if (!reduce) { s.y += s.v * dt; if (s.y > H + 2) { s.y = -2; s.x = Math.random() * W; } }
        var a = .45 + .55 * Math.abs(Math.sin(t / 1000 * s.sp + s.ph));
        x.fillStyle = 'rgba(' + s.hue + ',' + (a * (.35 + s.r / 2)).toFixed(3) + ')';
        x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.283); x.fill();
      }
      if (!reduce) {
        if (!shoot && Math.random() < .004) shoot = { x: Math.random() * W * .8 + W * .2, y: Math.random() * H * .35, l: 0 };
        if (shoot) {
          shoot.x -= 520 * dt; shoot.y += 260 * dt; shoot.l += dt;
          var g = x.createLinearGradient(shoot.x, shoot.y, shoot.x + 90, shoot.y - 45);
          g.addColorStop(0, 'rgba(160,230,255,.9)'); g.addColorStop(1, 'rgba(160,230,255,0)');

      copyText(el.getAttribute('data-copy'));
      el.classList.add('done'); el.textContent = 'Готово ✓';
      setTimeout(function () { el.classList.remove('done'); el.textContent = 'Копировать'; }, 1500);
      return;
    }
    if (t.closest('[data-copyall]') && cur) { copyText(cur.all.join('; ')); return; }
    if ((el = t.closest('[data-dl]'))) {
      var url = el.getAttribute('data-dl');
      try {
        if (tg && tg.downloadFile) tg.downloadFile({ url: url, file_name: (cur ? cur.slug : 'pro') + '.cfg' });
        else if (tg && tg.openLink) tg.openLink(url);
        else window.open(url, '_blank');
      } catch (e) { window.open(url, '_blank'); }
      return;
    }
    if ((el = t.closest('[data-bg]'))) {
      $('stage').style.background = el.getAttribute('data-bg');
      [].forEach.call(document.querySelectorAll('.bgs button'), function (b) { b.classList.toggle('on', b === el); });
    }
  });

  window.addEventListener('popstate', function () {
    var m = location.hash.match(/^#\/(.+)$/);
    if (m) { if (!cur || cur.slug !== decodeURIComponent(m[1])) openPlayer(decodeURIComponent(m[1]), false); }
    else closePlayer(true);
  });
  if (tg && tg.BackButton) { try { tg.BackButton.onClick(function () { closePlayer(); }); } catch (e) {} }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePlayer(); });

  // ================= Старт =================
  function showSkeleton() { $('list').innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>'; }
  function boot() {
    showSkeleton();
    Promise.all([
      cached('data/index.json', 'idx_v1'),
      cached('data/crosshair.json', 'xh_v1', true),
      cached('data/top10.json', 'top_v1').catch(function () { return null; })
    ]).then(function (r) {
      S.players = r[0].players; S.generated = (r[0].meta || {}).generated || ''; S.top = r[2];
      S.players.forEach(function (p) { S.by[p.slug] = p; });
      S.xh = r[1].players || {};
      S.favs = S.favs.filter(function (s) { return S.by[s]; });
      $('sub').textContent = S.players.length + ' игроков' + (S.generated ? ' · данные от ' + S.generated.slice(0, 10) : '');
      renderList(true);
      var m = location.hash.match(/^#\/(.+)$/), sp = params.get('p') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param);
      var open = m ? decodeURIComponent(m[1]) : sp;
      if (open && S.by[open]) openPlayer(open, !m);
    }).catch(function () {
      $('sub').textContent = 'Связь с базой потеряна';
      $('list').innerHTML = '<div class="error"><div class="big" style="font-size:42px">🛰</div><p>Не удалось загрузить базу игроков.<br>Проверьте интернет и попробуйте снова.</p><button class="btn" type="button" id="retry">Повторить</button></div>';
      $('retry').addEventListener('click', boot);
    });
  }
  boot();
})();
</script>
</body>
</html>
